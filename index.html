
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратный отчет до Нового года</title>
    <link rel="stylesheet" href="NY.css">
    <a href="NY2.html" class="s">СОЗДАйТЕ СВОЮ ОТКРЫТКУ</a>
</head>
<body>
    <div class="container">
        <h1>Генератор Идей для Подарков</h1>
        <button id="generate-btn">Получить Идею Подарка</button>
        <p id="gift-idea"></p>
    </div>
    <div class="snow-globe" id="snowGlobe">
        <div class="snow" id="snow"></div>
        <div class="base"></div>
    </div>
    <div class="container">
        <h1>До Нового года осталось:</h1>
        <div id="countdown">
            <div class="time" id="days">00</div>
            <div class="label">Дней</div>
            <div class="time" id="hours">00</div>
            <div class="label">Часов</div>
            <div class="time" id="minutes">00</div>
            <div class="label">Минут</div>
            <div class="time" id="seconds">00</div>
            <div class="label">Секунд</div>
            <div class="snowflakes">
                <div class="snowflake">❄</div>
                <div class="snowflake">❄</div>
                <div class="snowflake">❄</div>
                <div class="snowflake">❄</div>
                <div class="snowflake">❄</div>
                <div class="snowflake">❄</div>
                <div class="snowflake">❄</div>
                <div class="snowflake">❄</div>
                <div class="snowflake">❄</div>
                <div class="snowflake">❄</div>
            </div>
        </div>
    </div>
    
    <script src="NY.js"></script>
</body>
